[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nibkit"
version = "0.1.0"
description = "Parse compiled iOS/macOS Interface Builder archives (.nib / .storyboardc) for pentest and reverse engineering."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["ios", "nib", "storyboard", "xib", "reverse-engineering", "pentest", "ibtool", "uikit", "nibarchive"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
    "Operating System :: OS Independent",
]

[project.scripts]
nibkit = "nibkit:main"

[tool.hatch.build]
py-modules = ["nibkit"]
